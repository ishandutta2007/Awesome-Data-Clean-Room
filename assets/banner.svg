<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CSS Styles and Animations -->
  <style>
    .bg-grid { animation: gridMove 20s linear infinite; }
    .pulse-node { animation: pulse 3s ease-in-out infinite alternate; }
    .float-card { animation: float 6s ease-in-out infinite alternate; }
    .dash-line { stroke-dasharray: 8 6; animation: dash 15s linear infinite; }
    .dash-line-rev { stroke-dasharray: 6 6; animation: dashRev 20s linear infinite; }
    .orbit-particle { animation: rotate 12s linear infinite; transform-origin: 1000px 180px; }
    
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 6px #06b6d4); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 100; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.08" filter="url(#glow-cyan)" />
  <circle cx="1050" cy="280" r="160" fill="#8b5cf6" opacity="0.1" filter="url(#glow-purple)" />

  <!-- Dynamic / Animated Background Data Flow Lines (Stays in background behind text) -->
  <g opacity="0.35">
    <path d="M -50,220 Q 200,60 450,220 T 950,150 T 1250,280" fill="none" stroke="url(#accent-cyan)" stroke-width="2" class="dash-line" />
    <path d="M -50,100 Q 300,300 650,120 T 1250,80" fill="none" stroke="url(#accent-purple)" stroke-width="1.5" class="dash-line-rev" />
  </g>

  <!-- Right Side Interactive TEE / Data Clean Room Dynamic Diagram -->
  <g transform="translate(100, 0)">
    <!-- Data Node Left (Party A) -->
    <g class="float-card" style="animation-delay: 0s;">
      <rect x="720" y="70" width="110" height="60" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
      <text x="775" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Data Party A</text>
      <text x="775" y="116" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Encrypted Datasets</text>
    </g>

    <!-- Data Node Left (Party B) -->
    <g class="float-card" style="animation-delay: 1.5s;">
      <rect x="720" y="230" width="110" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9" />
      <text x="775" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Data Party B</text>
      <text x="775" y="276" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Identity / PII</text>
    </g>

    <!-- Connecting Rays -->
    <line x1="830" y1="100" x2="940" y2="160" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" class="dash-line" />
    <line x1="830" y1="260" x2="940" y2="200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" class="dash-line" />

    <!-- Central Secure Clean Room (TEE Vault) -->
    <g class="float-card" style="animation-delay: 0.8s;">
      <circle cx="1000" cy="180" r="65" fill="#0f172a" stroke="url(#accent-cyan)" stroke-width="3" filter="url(#glow-cyan)" />
      <!-- Lock Icon / TEE Graphic -->
      <path d="M 990 175 V 165 A 10 10 0 0 1 1010 165 V 175 M 985 175 H 1015 V 195 H 985 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="1000" y="215" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle">TEE / MPC</text>
    </g>

    <!-- Pulsing Node Particles -->
    <circle cx="885" cy="130" r="5" fill="#06b6d4" class="pulse-node" />
    <circle cx="885" cy="230" r="5" fill="#8b5cf6" class="pulse-node" style="animation-delay: 1s;" />
  </g>

  <!-- Main Foreground Content (Title, Badges, Subtitle) - Protected Foreground -->
  <!-- Top Pill / Badge -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="16" r="6" fill="#10b981" />
    <text x="34" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12">
      PRIVACY-PRESERVING DATA COLLABORATION
    </text>
  </g>

  <!-- Title -->
  <text x="80" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    Awesome Data Clean Room
  </text>

  <!-- Subtitle -->
  <text x="80" y="182" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18">
    Curated Hub for Enterprise Clean Rooms, TEEs, MPC &amp; Differential Privacy 🔐 🤝
  </text>

  <!-- Tech Feature Badges -->
  <g transform="translate(80, 220)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <text x="80" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      🛡️ TEE &amp; Enclaves
    </text>

    <!-- Badge 2 -->
    <rect x="175" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="265" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      ⚡ Multiparty Computation
    </text>

    <!-- Badge 3 -->
    <rect x="370" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <text x="455" y="23" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      📊 Differential Privacy
    </text>
  </g>

  <!-- Bottom Stats Bar / Footer note -->
  <g transform="translate(80, 300)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      ⚡ Enterprise SaaS Platforms &amp; Open-Source Privacy Frameworks Directory
    </text>
  </g>
</svg>
